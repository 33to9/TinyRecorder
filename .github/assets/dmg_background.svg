<!-- Source of dmg_background.png / dmg_background@2x.png (660x400 Finder window).
     Icon positions come from build.yml: app at (192,210), Applications at (468,210), icon size 128.
     Render: see .github/scripts/render_dmg_background.mjs -->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <rect width="660" height="400" fill="#f5f5f7"/>
  <text x="330" y="58" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="500" fill="#1d1d1f">Drag TinyRecorder to Applications to install</text>
  <text x="330" y="82" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="13" fill="#6e6e73">拖到「应用程序」即可安装</text>
  <!-- arrow between the two icons -->
  <rect x="270" y="201" width="98" height="18" rx="9" fill="#6b8ff7"/>
  <path d="M362 188 L394 210 L362 232 Z" fill="#6b8ff7"/>
  <!-- first-launch hint -->
  <rect x="70" y="316" width="520" height="66" rx="12" fill="#ffffff" stroke="#e0e0e5"/>
  <circle cx="98" cy="349" r="11" fill="#ff9f0a"/>
  <text x="98" y="354" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#ffffff">!</text>
  <text x="120" y="342" font-family="Noto Sans CJK SC" font-size="13" font-weight="500" fill="#1d1d1f">Blocked on first launch? Settings → Privacy &amp; Security → Open Anyway</text>
  <text x="120" y="363" font-family="Noto Sans CJK SC" font-size="11.5" fill="#6e6e73">首次打开被拦截？系统设置 → 隐私与安全性 → 点「仍要打开」</text>
</svg>
