<!-- Source of dmg_background.png / dmg_background@2x.png (660x400 Finder window).
     Icon positions come from build.yml: app at (192,210), Applications at (468,210), icon size 128.
     English only: a DMG background is a static image and can't follow the system language,
     so it uses the app's default language. Never mix languages here.
     Render: see .github/scripts/render_dmg_background.mjs -->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <rect width="660" height="400" fill="#f5f5f7"/>
  <text x="330" y="72" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="500" fill="#1d1d1f">Drag TinyRecorder to Applications to install</text>
  <!-- arrow between the two icons -->
  <rect x="270" y="201" width="98" height="18" rx="9" fill="#6b8ff7"/>
  <path d="M362 188 L394 210 L362 232 Z" fill="#6b8ff7"/>
  <!-- first-launch hint -->
  <rect x="70" y="322" width="520" height="52" rx="12" fill="#ffffff" stroke="#e0e0e5"/>
  <circle cx="98" cy="348" r="11" fill="#ff9f0a"/>
  <text x="98" y="353" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#ffffff">!</text>
  <text x="120" y="353" font-family="Noto Sans CJK SC" font-size="13" font-weight="500" fill="#1d1d1f">Blocked on first launch? Settings → Privacy &amp; Security → Open Anyway</text>
</svg>
