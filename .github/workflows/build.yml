name: Build TinyRecorder

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'appcast.xml', 'img/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:  # macos-13 已退役（永久排队），仅用 14/15
        os: [macos-15, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          # Pick newest available Xcode (>= 26 preferred, fallback to default)
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v "Xcode.app" | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          sw_vers

      - name: Build (ad-hoc signed, universal binary)
        run: |
          set -o pipefail
          # On tag builds, force app version & build number to match the tag.
          # The appcast job derives sparkle:version from the tag (dots stripped)
          # and Sparkle compares it against CFBundleVersion — they must stay in sync,
          # otherwise Sparkle offers "updates" between identical versions forever.
          EXTRA=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGV="${GITHUB_REF_NAME#v}"
            EXTRA="MARKETING_VERSION=${TAGV} CURRENT_PROJECT_VERSION=$(echo "$TAGV" | tr -d '.')"
            echo "tag build override: $EXTRA"
          fi
          xcodebuild -project QuickRecorder.xcodeproj \
            -scheme QuickRecorder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            $EXTRA \
            clean build -quiet 2>&1 | tail -80

      - name: Package app (zip + dmg)
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "TinyRecorder.app" -path "*Release*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "TinyRecorder.app" -not -path "*/quick*" | head -1)
          fi
          echo "APP_PATH=$APP_PATH"
          [ -z "$APP_PATH" ] && { echo "❌ TinyRecorder.app not found"; exit 1; }

          VERSION=$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleShortVersionString)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Ad-hoc sign
          codesign --force --deep --sign - "$APP_PATH"

          # Zip
          ditto -c -k --keepParent "$APP_PATH" "TinyRecorder_v${VERSION}_macOS.zip"

          # DMG (staging dir with Applications symlink => standard drag-to-install window)
          STAGE=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGE/TinyRecorder.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "TinyRecorder" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "TinyRecorder_v${VERSION}.dmg"
          rm -rf "$STAGE"

          shasum -a 256 TinyRecorder_v${VERSION}.dmg TinyRecorder_v${VERSION}_macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyRecorder-${{ env.VERSION }}
          path: |
            TinyRecorder_v${{ env.VERSION }}.dmg
            TinyRecorder_v${{ env.VERSION }}_macOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TinyRecorder ${{ env.VERSION }}
          body: |
            ## TinyRecorder ${{ env.VERSION }}

            Fork of [QuickRecorder](https://github.com/lihaoyun6/QuickRecorder) by lihaoyun6, with macOS 27 compatibility fixes.

            ### Changes vs upstream v1.6.9
            - Fixed: menu bar controls (stop / pause / camera) not responding on macOS 27 (upstream issue #295)
            - Changed: menu bar icon is now shown by default (new-user friendly; can be disabled in Settings)

            ### Install
            1. Download `TinyRecorder_v${{ env.VERSION }}.dmg`
            2. Open the dmg, drag TinyRecorder into the Applications folder
            3. First launch — app is ad-hoc signed (not notarized):
               - **macOS 15 and later**: double-click once (a warning appears), then open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**; or run `xattr -cr /Applications/TinyRecorder.app` in Terminal
               - Older macOS: right-click the app → **Open**
            4. Grant Screen Recording / Microphone permissions, then relaunch

            Licensed under AGPL-3.0. Original copyright © 2024 lihaoyun6.
          files: |
            TinyRecorder_v${{ env.VERSION }}.dmg
            TinyRecorder_v${{ env.VERSION }}_macOS.zip

  appcast:
    # After a tag release: sign the released dmg with the Sparkle EdDSA key
    # and commit an updated appcast.xml back to main.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and commit appcast.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          CVERSION=$(echo "$TAG" | tr -d '.')
          REPO="$GITHUB_REPOSITORY"

          # Wait for the release assets (needs:build normally guarantees them)
          for i in $(seq 1 12); do
            if gh release download "v${TAG}" --repo "$REPO" --pattern "TinyRecorder_v${TAG}.dmg" --clobber; then
              break
            fi
            if [ "$i" = "12" ]; then echo "release assets not found"; exit 1; fi
            sleep 10
          done

          # Sign the dmg exactly as released (EdDSA / Sparkle 2)
          SIG=$(python3 .github/scripts/sparkle_eddsa.py sign "$SPARKLE_PRIVATE_KEY" "TinyRecorder_v${TAG}.dmg")
          LENGTH=$(stat -c%s "TinyRecorder_v${TAG}.dmg")
          DATE=$(date -R)
          RELURL="https://github.com/${REPO}/releases/tag/v${TAG}"
          DMGURL="https://github.com/${REPO}/releases/download/v${TAG}/TinyRecorder_v${TAG}.dmg"

          cat > appcast.xml <<EOF
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>TinyRecorder Changelog</title>
                  <link>https://raw.githubusercontent.com/${REPO}/main/appcast.xml</link>
                  <description>Most recent changes with links to updates.</description>
                  <language>en</language>
                  <item>
                      <title>Version ${TAG}</title>
                      <link>${RELURL}</link>
                      <sparkle:releaseNotesLink>${RELURL}</sparkle:releaseNotesLink>
                      <pubDate>${DATE}</pubDate>
                      <enclosure url="${DMGURL}" length="${LENGTH}" type="application/x-bzip2" sparkle:edSignature="${SIG}" />
                      <sparkle:version>${CVERSION}</sparkle:version>
                      <sparkle:shortVersionString>${TAG}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>12.3</sparkle:minimumSystemVersion>
                      <description><![CDATA[
                          <p>TinyRecorder ${TAG} — see the release page for details.</p>
                      ]]></description>
                  </item>
              </channel>
          </rss>
          EOF

          SHA=$(gh api "repos/${REPO}/contents/appcast.xml" --jq .sha)
          CONTENT=$(base64 -w0 appcast.xml)
          gh api -X PUT "repos/${REPO}/contents/appcast.xml" \
            -f message="chore: update appcast.xml for v${TAG}" \
            -f content="${CONTENT}" -f sha="${SHA}" --jq '.commit.sha'
          echo "appcast.xml updated for v${TAG}"