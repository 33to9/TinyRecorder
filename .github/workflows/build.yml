name: Build TinyRecorder

on:
  push:
    branches: [main, 'fix/**']
    tags: ['v*']
    paths-ignore: ['**.md', 'appcast.xml', 'img/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Build on ONE fixed runner: a matrix would upload two different builds under the
    # same asset names, and whichever finished last would silently become the release.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          # Newest installed Xcode, excluding beta / RC builds
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          sw_vers

      - name: Compute version
        run: |
          # CFBundleVersion must grow monotonically for Sparkle.
          # Old scheme (strip dots) broke on 1.8.0 -> "180" < "1714".
          # New scheme: major*10000 + minor*100 + patch  (1.7.15 -> 10715, 1.8.0 -> 10800)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGV="${GITHUB_REF_NAME#v}"
            IFS=. read -r MA MI PA <<< "$TAGV"
            BUILDNUM=$(( 10#${MA:-0} * 10000 + 10#${MI:-0} * 100 + 10#${PA:-0} ))
            echo "TAGV=$TAGV" >> "$GITHUB_ENV"
            echo "BUILDNUM=$BUILDNUM" >> "$GITHUB_ENV"
            echo "tag $TAGV -> CFBundleVersion $BUILDNUM"
          fi

      - name: Build (ad-hoc signed, universal binary)
        run: |
          set -o pipefail
          # On tag builds, force app version & build number to match the tag.
          # The appcast job derives sparkle:version from the tag (dots stripped)
          # and Sparkle compares it against CFBundleVersion — they must stay in sync,
          # otherwise Sparkle offers "updates" between identical versions forever.
          EXTRA=""
          if [ -n "$BUILDNUM" ]; then
            EXTRA="MARKETING_VERSION=${TAGV} CURRENT_PROJECT_VERSION=${BUILDNUM}"
            echo "tag build override: $EXTRA"
          fi
          xcodebuild -project QuickRecorder.xcodeproj \
            -scheme QuickRecorder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            $EXTRA \
            clean build -quiet 2>&1 | tail -80

      - name: Package app (zip + dmg)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "TinyRecorder.app" -path "*Release*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "TinyRecorder.app" -not -path "*/quick*" | head -1)
          fi
          echo "APP_PATH=$APP_PATH"
          [ -z "$APP_PATH" ] && { echo "❌ TinyRecorder.app not found"; exit 1; }

          VERSION=$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleShortVersionString)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Code signing.
          # If the MACOS_CERT_P12 secret is set, sign with that fixed (self-signed) certificate:
          # macOS ties Screen Recording / Microphone permission to the signing identity, so a
          # stable certificate keeps those permissions across updates. Ad-hoc signatures change
          # on every build, forcing users to re-grant permission after each update.
          SIGN_ID="-"
          if [ -n "$MACOS_CERT_P12" ]; then
            KC="$RUNNER_TEMP/signing.keychain-db"
            KCPW=$(uuidgen)
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCPW" "$KC"
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            # Self-signed certs are "not trusted", so look the identity up without -v
            SIGN_ID=$(security find-identity -p codesigning "$KC" | awk 'NR==1 && $2 ~ /^[0-9A-F]{40}$/ {print $2}')
            if [ -z "$SIGN_ID" ]; then
              SIGN_ID=$(security find-identity "$KC" | awk '$2 ~ /^[0-9A-F]{40}$/ {print $2; exit}')
            fi
            [ -z "$SIGN_ID" ] && { echo "❌ MACOS_CERT_P12 set but no signing identity found"; exit 1; }
            echo "Signing with fixed certificate $SIGN_ID"
          else
            echo "⚠️ MACOS_CERT_P12 not set — falling back to ad-hoc signing (permissions reset on every update)"
          fi
          # Nested code (Sparkle framework, XPC services) first, then the app with its entitlements.
          # Previously the entitlements were dropped by the final re-sign.
          codesign --force --deep --sign "$SIGN_ID" "$APP_PATH"
          codesign --force --sign "$SIGN_ID" \
            --entitlements QuickRecorder/QuickRecorder.entitlements "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" || echo "⚠️ verify reported issues (expected for self-signed trust)"
          codesign -d --entitlements - "$APP_PATH"
          codesign -d -r- "$APP_PATH"

          # Zip
          ditto -c -k --keepParent "$APP_PATH" "TinyRecorder_v${VERSION}_macOS.zip"

          # DMG (appdmg: app icon left, Applications right, arrow background)
          STAGE=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGE/TinyRecorder.app"
          cp .github/assets/dmg_background.png "$STAGE/background.png"
          cat > "$STAGE/spec.json" <<'SPEC'
          {
            "title": "TinyRecorder",
            "background": "background.png",
            "icon-size": 128,
            "format": "UDZO",
            "contents": [
              { "x": 192, "y": 210, "type": "file", "path": "TinyRecorder.app" },
              { "x": 468, "y": 210, "type": "link", "path": "/Applications" }
            ]
          }
          SPEC
          if ! npx --yes appdmg@0.6.6 "$STAGE/spec.json" "TinyRecorder_v${VERSION}.dmg"; then
            echo "⚠️ appdmg failed, falling back to plain hdiutil layout"
            rm -f "TinyRecorder_v${VERSION}.dmg"
            ln -s /Applications "$STAGE/Applications"
            rm "$STAGE/spec.json" "$STAGE/background.png"
            hdiutil create -volname "TinyRecorder" \
              -srcfolder "$STAGE" \
              -ov -format UDZO \
              "TinyRecorder_v${VERSION}.dmg"
          fi
          rm -rf "$STAGE"

          shasum -a 256 TinyRecorder_v${VERSION}.dmg TinyRecorder_v${VERSION}_macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyRecorder-${{ env.VERSION }}
          path: |
            TinyRecorder_v${{ env.VERSION }}.dmg
            TinyRecorder_v${{ env.VERSION }}_macOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TinyRecorder ${{ env.VERSION }}
          body: |
            ## TinyRecorder ${{ env.VERSION }}

            Fork of [QuickRecorder](https://github.com/lihaoyun6/QuickRecorder) by lihaoyun6, with macOS 27 compatibility fixes.

            ### Changes vs upstream v1.6.9
            - Fixed: menu bar controls (stop / pause / camera) not responding on macOS 27 (upstream issue #295)
            - Changed: menu bar icon is now shown by default (new-user friendly; can be disabled in Settings)

            ### Install
            1. Download `TinyRecorder_v${{ env.VERSION }}.dmg`
            2. Open the dmg, drag TinyRecorder into the Applications folder
            3. First launch — app is ad-hoc signed (not notarized):
               - **macOS 15 and later**: double-click once (a warning appears), then open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**; or run `xattr -cr /Applications/TinyRecorder.app` in Terminal
               - Older macOS: right-click the app → **Open**
            4. Grant Screen Recording / Microphone permissions, then relaunch

            Licensed under AGPL-3.0. Original copyright © 2024 lihaoyun6.
          files: |
            TinyRecorder_v${{ env.VERSION }}.dmg
            TinyRecorder_v${{ env.VERSION }}_macOS.zip

  appcast:
    # After a tag release: sign the released dmg with the Sparkle EdDSA key
    # and commit an updated appcast.xml back to main.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and commit appcast.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          # Must match CFBundleVersion computed in the build job
          IFS=. read -r MA MI PA <<< "$TAG"
          CVERSION=$(( 10#${MA:-0} * 10000 + 10#${MI:-0} * 100 + 10#${PA:-0} ))
          REPO="$GITHUB_REPOSITORY"

          # Wait for the release assets (needs:build normally guarantees them)
          for i in $(seq 1 12); do
            if gh release download "v${TAG}" --repo "$REPO" --pattern "TinyRecorder_v${TAG}.dmg" --clobber; then
              break
            fi
            if [ "$i" = "12" ]; then echo "release assets not found"; exit 1; fi
            sleep 10
          done

          # Sign the dmg exactly as released (EdDSA / Sparkle 2)
          # "-" = read the key from $SPARKLE_PRIVATE_KEY (keeps it out of the process list)
          SIG=$(python3 .github/scripts/sparkle_eddsa.py sign - "TinyRecorder_v${TAG}.dmg")
          LENGTH=$(stat -c%s "TinyRecorder_v${TAG}.dmg")
          DATE=$(date -R)
          RELURL="https://github.com/${REPO}/releases/tag/v${TAG}"
          DMGURL="https://github.com/${REPO}/releases/download/v${TAG}/TinyRecorder_v${TAG}.dmg"

          cat > appcast.xml <<EOF
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>TinyRecorder Changelog</title>
                  <link>https://raw.githubusercontent.com/${REPO}/main/appcast.xml</link>
                  <description>Most recent changes with links to updates.</description>
                  <language>en</language>
                  <item>
                      <title>Version ${TAG}</title>
                      <link>${RELURL}</link>
                      <sparkle:releaseNotesLink>${RELURL}</sparkle:releaseNotesLink>
                      <pubDate>${DATE}</pubDate>
                      <enclosure url="${DMGURL}" length="${LENGTH}" type="application/octet-stream" sparkle:edSignature="${SIG}" />
                      <sparkle:version>${CVERSION}</sparkle:version>
                      <sparkle:shortVersionString>${TAG}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>12.3</sparkle:minimumSystemVersion>
                      <description><![CDATA[
                          <p>TinyRecorder ${TAG} — see the release page for details.</p>
                      ]]></description>
                  </item>
              </channel>
          </rss>
          EOF

          SHA=$(gh api "repos/${REPO}/contents/appcast.xml" --jq .sha)
          CONTENT=$(base64 -w0 appcast.xml)
          gh api -X PUT "repos/${REPO}/contents/appcast.xml" \
            -f message="chore: update appcast.xml for v${TAG}" \
            -f content="${CONTENT}" -f sha="${SHA}" --jq '.commit.sha'
          echo "appcast.xml updated for v${TAG}"