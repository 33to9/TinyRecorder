name: Build QuickRecorder

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.*.app || true

      - name: Show environment
        run: |
          xcodebuild -version
          sw_vers

      - name: Build (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -project QuickRecorder.xcodeproj \
            -scheme QuickRecorder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            clean build | tail -30

      - name: Package app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "QuickRecorder.app" -path "*Release*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "QuickRecorder.app" | head -1)
          fi
          echo "APP_PATH=$APP_PATH"
          # Ad-hoc sign so Gatekeeper treats it as signed-but-unnotarized
          codesign --force --deep --sign - "$APP_PATH"
          # Remove quarantine-attracting attributes
          ditto -c -k --keepParent "$APP_PATH" QuickRecorder-macOS.zip
          shasum -a 256 QuickRecorder-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickRecorder-patched
          path: QuickRecorder-macOS.zip
          retention-days: 30
